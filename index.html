ame:nth-child(4) .art{background:radial-gradient(circle at 50% 30%,#6b3354,#271b44 70%)}.gameBody{padding:15px}.gameBody strong{display:block;font-size:15px}.gameBody span{font-size:12px;color:var(--muted);display:block;margin-top:5px}.pill{display:inline-flex;padding:5px 9px;border:1px solid #674267;border-radius:20px;font-size:11px;color:#ffa1d0;background:#6d255b30}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;background:#1b1630f2;backdrop-filter:blur(18px);border-top:1px solid #403251;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;color:#aaa3ba;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-width:64px;padding:5px}.nav button i{font-size:23px;font-style:normal}.nav button.active{color:#ff4c9f}.hide{display:none!important}.field{background:#171229;border:1px solid #51415d;border-radius:12px;padding:12px 13px;width:100%;color:white;max-width:350px}.formLabel{display:block;color:var(--muted);font-size:12px;margin:14px 0 6px}.actionrow{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(100%,320px);margin:25px auto}.cell{aspect-ratio:1;border:1px solid #534065;border-radius:14px;background:#2b2146;color:#ff398f;font-size:44px;font-weight:900}.cell.o{color:#a79afe}.boardHead{text-align:center;margin-top:20px}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:350px;margin:22px auto}.memory button{aspect-ratio:1;background:#33264d;border:1px solid #664673;border-radius:12px;font-size:25px;color:white}.memory button.covered{font-size:23px;color:#9f8aa9}.answers{display:grid;gap:10px;margin:20px 0}.answers button{text-align:left;background:#2a2045;border:1px solid #504066;border-radius:12px;padding:15px;color:white}.answers button.good{border-color:#4eba9c;background:#1d4d46}.answers button.bad{border-color:#dd4a6b;background:#53263f}.reaction{width:100%;min-height:220px;border:0;border-radius:18px;background:#b34264;color:white;font-weight:850;font-size:22px;padding:25px}.reaction.ready{background:#239576}.activity{list-style:none;padding:0}.activity li{border-bottom:1px solid #3b3050;padding:13px 0;display:flex;justify-content:space-between;gap:10px;font-size:13px}.activity li:last-child{border:0}.muted{color:var(--muted)}.notice{border:1px solid #754a6c;background:#3a2147;border-radius:12px;padding:13px;font-size:13px;line-height:1.5}.foot{margin-top:45px;text-align:center;color:#777087;font-size:11px}.xpTrack{height:7px;background:#433453;border-radius:30px;overflow:hidden;margin:12px 0}.xpFill{height:100%;background:var(--grad);width:0}.back{background:none;border:0;color:#ded1eb;font-weight:700;padding:8px 0 20px}.result{font-size:15px;color:#f8aed0;font-weight:750;text-align:center;min-height:23px}.filters{display:flex;gap:7px;margin-bottom:15px;overflow:auto}.filters button{flex-shrink:0;border:1px solid #4d3c5f;color:#b9aecb;background:#211a37;padding:9px 14px;border-radius:30px;font-size:12px}.filters button.active{background:#673157;color:white;border-color:#b45286}.empty{color:var(--muted);font-size:13px}
@media(min-width:800px){.shell{display:grid;grid-template-columns:240px 1fr}.sidebar{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:32px 18px;border-right:1px solid #3b3150;gap:10px}.sideBtn{padding:14px;border:0;background:transparent;border-radius:12px;color:#a9a1bb;text-align:left;font-weight:650}.sideBtn.active{background:#352541;color:#ff68ae}.main{padding:35px 45px 50px}.top{justify-content:flex-end}.top .brand{display:none}.nav{display:none}.hero{padding:40px}.hero h1{font-size:43px}.games{grid-template-columns:repeat(4,1fr)}.art{height:160px}.stats{max-width:600px}.section{margin-top:36px}}

/* EDGY v13 – an app viewport with one intentional vertical scroll area.
   Keep pinch-to-zoom available for accessibility; stop double-tap zoom on
   interactive game controls using touch-action, never a blanket JS preventDefault. */
html,body{width:100%;height:100%;max-width:100%;overflow:hidden;overscroll-behavior:none}
body{min-width:0}
.shell{height:100dvh;min-height:0;width:100%;max-width:1240px;overflow:hidden}
.main{height:100%;min-width:0;max-width:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-y pinch-zoom}
.main::-webkit-scrollbar{display:none}
#screen,.top,.panel,.row,.section{min-width:0;max-width:100%}
#screen{overflow-wrap:break-word}
button,a,[role=button]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.filters{flex-wrap:wrap;overflow:visible}
.game,.panel{max-width:100%}
.nav{max-width:100vw}
@media(min-width:800px){
 .shell{grid-template-columns:240px minmax(0,1fr)}
 .sidebar{min-height:0;height:100dvh;overflow:hidden}
 .main{height:100dvh}
}

/* EDGY – unified icon navigation on mobile and desktop. */
.navIcon{width:20px;height:20px;flex:0 0 20px;display:block}
.sideBtn{display:flex;align-items:center;gap:13px;min-width:0;width:100%}
.sideBtn .navIcon{width:19px;height:19px;flex-basis:19px}
.nav{gap:3px;padding-inline:max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-right))}
.nav button{flex:1;min-width:0;padding:6px 1px;font-size:10px;gap:5px}
.nav button .navIcon{height:21px;width:21px;flex-basis:21px}
.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-weight:650}
.nav button.active .navIcon,.sideBtn.active .navIcon{color:#ff3f9b}
@media(max-width:350px){.nav button{font-size:9px}.nav button .navIcon{width:19px;height:19px}}

/* EDGY v15 – smooth page changes without replaying animation on live chess updates. */
#screen.edgyPageIn{animation:edgyPageEnter .3s cubic-bezier(.2,.82,.28,1) both}
@keyframes edgyPageEnter{from{opacity:0;transform:translate3d(0,11px,0);filter:blur(2px)}to{opacity:1;transform:translate3d(0,0,0);filter:blur(0)}}
.sideBtn,.nav button{transition:background-color .2s ease,color .2s ease,transform .2s ease}
.sideBtn:active,.nav button:active{transform:scale(.96)}
.game,.panel,.playerCard{backface-visibility:hidden}
.game:hover{transform:translateY(-3px)}
@media(prefers-reduced-motion:reduce){#screen.edgyPageIn{animation:none!important}.game:hover{transform:none}}

/* Logo acts as an accessible, lightweight home button */
button.brandButton{appearance:none;border:0;margin:0;background:linear-gradient(115deg,#ff075c,#c300a7);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:left;padding:3px 0;line-height:1.05;cursor:pointer;white-space:nowrap;user-select:none;align-self:flex-start;transition:opacity .18s ease,transform .18s ease}
button.brandButton:hover{opacity:.83;transform:translateY(-1px)}
button.brandButton:active{transform:translateY(0) scale(.98)}
button.brandButton:focus-visible{outline:2px solid #ef4197;outline-offset:5px;border-radius:3px}
button.brandButton small{font-size:9px;letter-spacing:3px;margin-top:3px}
@media(prefers-reduced-motion:reduce){button.brandButton{transition:none}}
.nav button{min-width:0!important;flex:1}.sideBtn{border-radius:3px!important}@media(max-width:380px){.nav button{font-size:9px!important;padding:4px 0!important}.nav .navIcon{width:18px!important;height:18px!important}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

il</span></button></nav>

<script>
"use strict";
const KEY="edgy_v1", defs=[{id:"chess",name:"Xadrez online",emoji:"♞",type:"Multiplayer",mode:"2 jogadores · Online"},{id:"checkers",name:"Damas online",emoji:"●",type:"Multiplayer",mode:"2 jogadores · Online"},{id:"tic",name:"Jogo do Galo",emoji:"✕",type:"Estratégia",mode:"1–2 jogadores"},{id:"reaction",name:"Reflexos",emoji:"◴",type:"Arcade",mode:"1 jogador"}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state={name:"Jogador",xp:0,history:[],...state};if(!Array.isArray(state.history))state.history=[];if(!Number.isFinite(state.xp))state.xp=0;
let page="home",filter="Todos",game=null,tic=[],turn="X",versus="cpu",locked=false,reactPhase="idle",reactStart=0,reactTimeout=null,reactTimes=[];
const $=s=>document.querySelector(s),screen=$("#screen");
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const level=()=>Math.floor(state.xp/100)+1,progress=()=>state.xp%100;
function animatePage(){const target=document.getElementById("screen");if(!target)return;target.classList.remove("edgyPageIn");void target.offsetWidth;target.classList.add("edgyPageIn")}
function nav(p){const changed=page!==p||Boolean(game);clearTimeout(reactTimeout);window.EDGY_chess?.close();window.EDGY_checkers?.close();game=null;page=p;render();document.querySelector(".main")?.scrollTo({top:0,behavior:"instant"});if(changed)animatePage()}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.page)));
$("#avatar").onclick=()=>nav("profile");
function complete(title,result,xp){state.xp+=xp;state.history.unshift({title,result,xp,date:new Date().toISOString()});state.history=state.history.slice(0,50);save()}
const gameIcon={
 chess:'<span class="edgyGameIcon edgyGameIconChess">♞</span>',
 checkers:'<span class="edgyGameIcon edgyGameIconDamas"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="23"/><circle cx="32" cy="32" r="14"/><path d="M19 42c7 5 19 5 26 0"/></svg></span>',
 reaction:'<span class="edgyGameIcon edgyGameIconReflexos"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="35" r="20"/><path d="M32 24v12l9-6M26 9h12M32 9v6M48 18l5-5"/></svg></span>',
 tic:'<span class="edgyGameIcon"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9 10 26 27M26 10 9 27M40 10 57 27M57 10 40 27"/><circle cx="18" cy="46" r="11"/><circle cx="48" cy="46" r="11"/></svg></span>'
};
function cards(items){return '<div class="games">'+items.map(g=>'<button class="game" data-game="'+g.id+'"><div class="art">'+(gameIcon[g.id]||g.emoji)+'</div><div class="gameBody"><strong>'+g.name+'</strong><span>'+g.type+' · '+g.mode+'</span></div></button>').join("")+'</div>'}
window.EDGY_openRoom=(name,code)=>{
 if(!["chess","checkers"].includes(name)||!/^[A-F0-9]{8}$/i.test(code||""))return;
 nav("games");game=name;
 if(name==="chess")window.EDGY_chess?.open(String(code).toUpperCase());
 else window.EDGY_checkers?.open(String(code).toUpperCase());
 document.querySelector(".main")?.scrollTo({top:0,behavior:"instant"});
 animatePage();
};
function wireGames(){document.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>openGame(b.dataset.game))}
function render(){screen.classList.toggle("edgyProfilePage",page==="profile"&&!game);screen.classList.remove("edgyLobby");document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("#avatar").textContent=state.name[0]?.toUpperCase()||"E";if(game){renderGame();return}
if(page==="home"){screen.innerHTML='<div class="hero panel"><span class="eyebrow">O teu espaço de jogo</span><h1>Boas, '+esc(state.name)+' <span style="color:#ff3c91">✦</span></h1><p class="sub">Uma partida rápida? Escolhe um jogo e diverte-te.</p><button class="primary" id="explore">Explorar jogos →</button></div><div class="stats"><div class="panel stat"><b>'+level()+'</b><span>Nível</span></div><div class="panel stat"><b>'+state.xp+'</b><span>XP total</span></div><div class="panel stat"><b>'+state.history.length+'</b><span>Partidas</span></div></div><section class="section"><div class="row space"><h2>Vamos jogar</h2><span class="pill">4 jogos</span></div>'+cards(defs)+'</section><section class="section panel"><h3>Joga online com a tua malta</h3><p class="sub">Joga Xadrez ou Damas online: cria uma sala privada e envia o convite a um amigo. Os minijogos locais continuam disponíveis.</p></section><section class="section"><div class="edgyRoomsTitle"><h3>Salas abertas</h3><button class="secondary" id="allRooms">Ver todas</button></div><div id="edgy-home-rooms"></div></section>';$("#explore").onclick=()=>nav("games");$("#allRooms").onclick=()=>nav("rooms");wireGames();window.EDGY_social?.renderRooms("edgy-home-rooms")}
if(page==="games"){const shown=defs.filter(g=>filter==="Todos"||g.type===filter);screen.innerHTML='<h1>Biblioteca</h1><p class="sub">Encontra o teu próximo jogo.</p><div class="filters">'+["Todos","Multiplayer","Estratégia","Arcade"].map(f=>'<button data-filter="'+f+'" class="'+(filter===f?"active":"")+'">'+f+'</button>').join("")+'</div>'+cards(shown);document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});wireGames()}
if(page==="rooms"){screen.innerHTML='<span class="eyebrow">Partidas online</span><h1>Salas abertas</h1><p class="sub">Partidas à espera de adversário ou em curso. As partidas terminadas estão no Histórico, dentro do Perfil.</p><div id="edgy-all-rooms"></div>';window.EDGY_social?.renderRooms("edgy-all-rooms")}
if(page==="players"){if(window.EDGY_players)window.EDGY_players.mount();else screen.innerHTML='<h1>Jogadores</h1><p class="sub">A carregar comunidade…</p>'}
if(page==="history"){if(window.EDGY_history)window.EDGY_history.mount(state.history);else screen.innerHTML='<h1>Histórico</h1><p class="sub">A carregar…</p>'}
if(page==="profile"){screen.innerHTML='<h1>O teu perfil</h1><p class="sub">Personaliza o teu perfil e o teu avatar.</p><div class="panel"><div class="row ownProfileIdentity"><div class="avatar" style="display:grid;place-items:center;font-size:23px">'+esc((state.name[0]||"E").toUpperCase())+'</div><div class="ownProfileName"><h3>'+esc(state.name)+'</h3><span class="sub">O teu espaço na EDGY</span></div><div class="playerMiniStats ownProfileStats" aria-label="As tuas estatísticas"><span class="playerMiniStat"><strong>'+level()+'</strong><small>Nível</small></span><span class="playerMiniStat"><strong>'+state.xp+'</strong><small>XP</small></span><span class="playerMiniStat"><strong>'+state.history.length+'</strong><small>Partidas</small></span></div></div><div class="xpTrack"><div class="xpFill" style="width:'+progress()+'%"></div></div><p class="sub">'+progress()+'/100 XP para o próximo nível</p><label class="formLabel" for="username">Nome visível (pode repetir-se)</label><input class="field" id="username" maxlength="22" value="'+esc(state.name)+'"><div class="actionrow"><button class="primary" id="saveName">Guardar nome</button></div></div><section class="section panel edgyHistoryShortcut"><div class="edgyHistoryShortcutInfo"><span class="edgyHistoryShortcutIcon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg></span><div><h3>Histórico de partidas</h3><p class="sub">Consulta resultados, adversários e revê as tuas partidas.</p></div></div><button class="secondary" id="profileHistory" type="button">Ver histórico <span aria-hidden="true">→</span></button></section><section class="section notice">Com conta, o progresso pode ser sincronizado entre dispositivos. Convidados poderão perder os dados se apagarem os dados do navegador.</section>';$("#profileHistory").onclick=()=>nav("history");$("#saveName").onclick=()=>{state.name=$("#username").value.trim().slice(0,22)||"Jogador";save();render()}}
}
function openGame(id){game=id;locked=false;if(id==="checkers"){window.EDGY_checkers?.open();document.querySelector(".main")?.scrollTo({top:0,behavior:"instant"});animatePage();return;}if(id==="chess"){window.EDGY_chess?.open();document.querySelector(".main")?.scrollTo({top:0,behavior:"instant"});animatePage();return;}if(id==="tic"){tic=Array(9).fill("");turn="X";versus="cpu"}if(id==="reaction"){reactPhase="idle";reactTimes=[]}renderGame();document.querySelector(".main")?.scrollTo({top:0,behavior:"instant"});animatePage()}
function gameHeader(name,sub){return '<button class="back" id="goBack">← Voltar aos jogos</button><h1>'+name+'</h1><p class="sub">'+sub+'</p>'}
function attachBack(){$("#goBack").onclick=()=>nav("games")}
function renderGame(){if(game==="checkers")return window.EDGY_checkers?.render();if(game==="chess")return window.EDGY_chess?.render();if(game==="tic")return drawTic();if(game==="reaction")return drawReaction()}
function winner(){const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const [a,b,c] of lines)if(tic[a]&&tic[a]===tic[b]&&tic[b]===tic[c])return tic[a];return tic.every(Boolean)?"draw":null}
function playTic(i){if(locked||tic[i]||(versus==="cpu"&&turn==="O"))return;tic[i]=turn;let w=winner();if(w){finishTic(w);return}turn=turn==="X"?"O":"X";drawTic();if(versus==="cpu"&&turn==="O"){locked=true;setTimeout(()=>{if(game!=="tic")return;const empty=tic.map((v,i)=>v=== ""?i:-1).filter(i=>i>=0);let idx=empty[Math.floor(Math.random()*empty.length)];for(const p of ["O","X"]){for(const k of empty){const a=[...tic];a[k]=p;const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];if(lines.some(l=>l.every(j=>a[j]===p))){idx=k;break}}if(idx!==undefined&&(()=>{const a=[...tic];a[idx]=p;return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(l=>l.every(j=>a[j]===p))})())break}if(idx!==undefined)tic[idx]="O";locked=false;w=winner();if(w)finishTic(w);else{turn="X";drawTic()}},320)}}
function finishTic(w){locked=true;const res=w==="draw"?"Empate":w==="X"?"Vitória X":"Vitória O";complete("Jogo do Galo",res,w==="draw"?10:20);drawTic();$("#ticResult").textContent=res+" · "+(w==="draw"?10:20)+" XP"}
function drawTic(){screen.innerHTML=gameHeader("Jogo do Galo","Joga contra o computador ou com alguém no mesmo telemóvel.")+'<div class="row"><button class="'+(versus==="cpu"?"primary":"secondary")+'" id="cpu">Vs. CPU</button><button class="'+(versus==="local"?"primary":"secondary")+'" id="local">2 jogadores</button></div><div class="boardHead"><span class="pill">'+(locked?"Partida terminada": "Vez de "+turn)+'</span></div><div class="board">'+tic.map((v,i)=>'<button class="cell '+(v==="O"?"o":"")+'" data-cell="'+i+'" aria-label="Casa '+(i+1)+'">'+(v||"")+'</button>').join("")+'</div><div id="ticResult" class="result"></div><div class="row" style="justify-content:center"><button class="secondary" id="newTic">Nova partida</button></div>';attachBack();$("#newTic").onclick=()=>{tic=Array(9).fill("");turn="X";locked=false;drawTic()};for(const id of ["cpu","local"])$("#"+id).onclick=()=>{versus=id;tic=Array(9).fill("");turn="X";locked=false;drawTic()};document.querySelectorAll("[data-cell]").forEach(b=>b.onclick=()=>playTic(Number(b.dataset.cell)))}
function drawReaction(){screen.innerHTML=gameHeader("Reflexos","Toca no alvo quando ficar verde. Faz 3 rondas.")+'<div class="panel"><div class="row space"><span class="pill">Ronda '+Math.min(reactTimes.length+1,3)+'/3</span><span class="sub">'+(reactTimes.length?"Último: "+reactTimes[reactTimes.length-1]+" ms":"")+'</span></div><div style="height:20px"></div><button class="reaction '+(reactPhase==="ready"?"ready":"")+'" id="tap">'+({idle:"Toca para começar",waiting:"Espera pelo verde...",ready:"TOCA!",done:"Concluído!"}[reactPhase]||"Toca para começar")+'</button><p id="reactMsg" class="result" style="margin:18px 0 0">'+(reactPhase==="done"?"Média: "+Math.round(reactTimes.reduce((a,b)=>a+b,0)/3)+" ms":"")+'</p><div class="actionrow"><button class="secondary" id="resetReact">Recomeçar</button></div></div>';attachBack();$("#resetReact").onclick=()=>{clearTimeout(reactTimeout);reactPhase="idle";reactTimes=[];drawReaction()};$("#tap").onclick=()=>{if(reactPhase==="idle"){reactPhase="waiting";drawReaction();reactTimeout=setTimeout(()=>{if(game==="reaction"&&reactPhase==="waiting"){reactPhase="ready";reactStart=performance.now();drawReaction()}},900+Math.random()*2300)}else if(reactPhase==="waiting"){clearTimeout(reactTimeout);reactPhase="idle";drawReaction();$("#reactMsg").textContent="Cedo demais! Tenta outra vez."}else if(reactPhase==="ready"){reactTimes.push(Math.round(performance.now()-reactStart));if(reactTimes.length===3){reactPhase="done";const avg=Math.round(reactTimes.reduce((a,b)=>a+b,0)/3);complete("Reflexos","Média "+avg+" ms",Math.max(10,Math.round(30000/avg)));drawReaction()}else{reactPhase="idle";drawReaction()}}else{reactTimes=[];reactPhase="idle";drawReaction()}}}
render();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=26").catch(()=>{}));
